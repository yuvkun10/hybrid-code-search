[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-code-search"
version = "0.1.0"
description = "AST-aware semantic and lexical code search with a pluggable, fully-offline default embedder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "yuvkun10" }]
keywords = ["code-search", "semantic-search", "embeddings", "ast", "retrieval"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "typer>=0.12",
  "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "httpx>=0.27"]
# Optional real-embedding backend. The core works without it.
transformers = ["sentence-transformers>=3.0"]

[project.scripts]
scs = "hybrid_code_search.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_code_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_redundant_casts = true
